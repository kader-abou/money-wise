name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Job 1 : Tests (tourne sur toutes les PRs et pushes) ──────────────────
  ci:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install

      - name: Générer le client Prisma
        run: bunx prisma generate

      - name: Lancer les tests
        run: bun run test

  # ─── Job 2 : Deploy (uniquement sur push vers main) ───────────────────────
  deploy:
    name: Deploy
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install

      # ── Prisma ──────────────────────────────────────────────────────────────
      # generate doit tourner AVANT le build pour que les types @prisma/client
      # soient disponibles pour TypeScript
      - name: Générer le client Prisma
        run: bunx prisma generate

      # Utilise DIRECT_URL (port 5432) — PgBouncer (6543) bloque les migrations
      - name: Appliquer les migrations
        run: bunx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}

      # ── Build TypeScript ────────────────────────────────────────────────────
      - name: Build
        run: bun run build

      # ── Déploiement ─────────────────────────────────────────────────────────
      # Décommente UNE SEULE section selon ta plateforme cible.

      # ┌─ RAILWAY ────────────────────────────────────────────────────────────┐
      # │ Secrets requis : RAILWAY_TOKEN (depuis railway.app → Account Settings│
      # │ Fichier de config : railway.toml                                     │
      # └──────────────────────────────────────────────────────────────────────┘
      - name: Deploy sur Railway
        run: |
          npm install -g @railway/cli@latest
          railway up --service moneywise-api --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # ┌─ RENDER ─────────────────────────────────────────────────────────────┐
      # │ Secrets requis : RENDER_DEPLOY_HOOK_URL (depuis Render → Settings →  │
      # │ Deploy Hooks). Fichier de config : render.yaml                       │
      # └──────────────────────────────────────────────────────────────────────┘
      # - name: Deploy sur Render
      #   run: curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      # ┌─ FLY.IO ─────────────────────────────────────────────────────────────┐
      # │ Secrets requis : FLY_API_TOKEN. Nécessite une carte bancaire.        │
      # │ Fichier de config : fly.toml                                         │
      # └──────────────────────────────────────────────────────────────────────┘
      # - name: Deploy sur Fly.io
      #   uses: superfly/flyctl-actions/setup-flyctl@master
      # - run: flyctl deploy --remote-only
      #   env:
      #     FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
