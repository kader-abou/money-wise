services:
  postgres:
    image: postgres:16-alpine
    container_name: moneywise-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: moneywise
      POSTGRES_PASSWORD: moneywise_dev
      POSTGRES_DB: moneywise_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneywise -d moneywise_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
